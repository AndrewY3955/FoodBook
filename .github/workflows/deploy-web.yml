name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter pub get
          flutter build web --release --base-href /FoodBook/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # Only the publishable key may ship. The supabase library itself
      # contains the literal "sb_secret_" in a prefix check, so match a
      # real key (prefix plus a long token), not the bare prefix.
      - name: Refuse to deploy private keys
        run: |
          if grep -rIlE "sb_secret_[A-Za-z0-9_-]{16,}" build/web; then
            echo "Private key material found in build output." >&2
            exit 1
          fi

      - name: Publish to gh-pages
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
